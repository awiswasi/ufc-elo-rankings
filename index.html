<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Elo Rating System</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-primary:#0a0a0b;--bg-secondary:#111114;--bg-card:#16161a;--bg-card-hover:#1c1c22;--border:#2a2a32;--text-primary:#e8e6e3;--text-secondary:#8a8a95;--text-muted:#5a5a66;--accent-red:#e63946;--accent-red-dim:#e6394630;--accent-gold:#f0b429;--accent-gold-dim:#f0b42920;--accent-blue:#4895ef;--accent-blue-dim:#4895ef25;--accent-green:#2ec4b6;--accent-green-dim:#2ec4b620;--accent-purple:#a855f7;--accent-purple-dim:#a855f720;--win:#2ec4b6;--loss:#e63946;--draw:#8a8a95;--gradient-fire:linear-gradient(135deg,#e63946,#f0b429)}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg-primary);color:var(--text-primary);font-family:'Barlow',sans-serif;line-height:1.5;overflow-x:hidden}.app{min-height:100vh}
.header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:16px 32px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.logo{display:flex;align-items:baseline;gap:12px}.logo h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;letter-spacing:2px;text-transform:uppercase;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.logo span{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:3px}
.nav{display:flex;gap:3px;background:var(--bg-primary);border-radius:8px;padding:3px;flex-wrap:wrap}.nav-btn{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;padding:7px 14px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:6px;transition:all .2s;white-space:nowrap}.nav-btn:hover{color:var(--text-secondary)}.nav-btn.active{background:var(--bg-card);color:var(--text-primary);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.main{max-width:1400px;margin:0 auto;padding:20px 32px}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 18px}.stat-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:2px}.stat-value{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600}.stat-value.gold{color:var(--accent-gold)}.stat-value.red{color:var(--accent-red)}.stat-value.blue{color:var(--accent-blue)}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}.search-input{font-family:'Barlow',sans-serif;font-size:14px;padding:9px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);width:240px;outline:none;transition:border-color .2s}.search-input:focus{border-color:var(--accent-blue)}.search-input::placeholder{color:var(--text-muted)}.filter-select{font-family:'Barlow',sans-serif;font-size:13px;padding:9px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);outline:none;cursor:pointer}.filter-select option{background:var(--bg-card)}
.status-pills{display:flex;gap:3px;background:var(--bg-card);border-radius:8px;padding:3px;border:1px solid var(--border)}.status-pill{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:6px 14px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:6px;transition:all .2s}.status-pill:hover{color:var(--text-secondary)}.status-pill.active{color:var(--text-primary)}.status-pill.active[data-status="all"]{background:var(--accent-blue-dim);color:var(--accent-blue)}.status-pill.active[data-status="active"]{background:var(--accent-green-dim);color:var(--accent-green)}.status-pill.active[data-status="inactive"]{background:var(--accent-purple-dim);color:var(--accent-purple)}
.table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden}.table-wrap table{width:100%;border-collapse:collapse}.table-wrap th{font-family:'Barlow Condensed',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg-secondary);cursor:pointer;user-select:none;white-space:nowrap}.table-wrap th:hover{color:var(--text-secondary)}.table-wrap th.sorted{color:var(--accent-gold)}.table-wrap td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}.table-wrap tr{cursor:pointer;transition:background .15s}.table-wrap tbody tr:hover{background:var(--bg-card-hover)}
.rank-num{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:var(--text-muted);text-align:center}.rank-num.top3{color:var(--accent-gold)}.fighter-name{font-family:'Oswald',sans-serif;font-weight:500;font-size:15px;letter-spacing:.5px}.elo-val{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px}.elo-bar{display:inline-block;height:4px;border-radius:2px;background:var(--accent-red);margin-left:8px;vertical-align:middle;opacity:.6}.record{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.5px}.weight-badge{font-family:'Barlow Condensed',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:4px;background:var(--accent-blue-dim);color:var(--accent-blue);display:inline-block}.status-badge{font-family:'Barlow Condensed',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:4px;display:inline-block}.status-badge.active{background:var(--accent-green-dim);color:var(--accent-green)}.status-badge.inactive{background:var(--accent-purple-dim);color:var(--accent-purple)}.last-fight-col{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--text-muted)}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px}.page-btn{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;padding:6px 14px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);border-radius:6px;cursor:pointer;transition:all .2s}.page-btn:hover{background:var(--bg-card-hover);color:var(--text-primary)}.page-btn:disabled{opacity:.3;cursor:default}
.profile-back{font-family:'Barlow Condensed',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);background:none;border:none;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;gap:6px;transition:color .2s}.profile-back:hover{color:var(--text-primary)}.profile-header{display:flex;gap:32px;margin-bottom:28px;align-items:flex-start;flex-wrap:wrap}.profile-main{flex:1;min-width:280px}.profile-name{font-family:'Oswald',sans-serif;font-size:42px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1.1;margin-bottom:6px}.profile-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.profile-meta-item{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px}.profile-meta-item strong{color:var(--text-primary)}.profile-elo-cards{display:flex;gap:12px;flex-wrap:wrap}.elo-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 20px;min-width:120px}.elo-card-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted)}.elo-card-value{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700}.elo-card-value.current{color:var(--accent-red)}.elo-card-value.peak{color:var(--accent-gold)}.elo-card-value.record-val{color:var(--text-primary)}
.chart-section{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}.chart-title{font-family:'Oswald',sans-serif;font-size:16px;font-weight:500;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;color:var(--text-secondary)}.chart-canvas{width:100%;height:260px;position:relative}.chart-canvas svg{width:100%;height:100%}
.fight-row{display:grid;grid-template-columns:90px 1fr 70px 90px;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);align-items:center;font-size:13px;cursor:pointer;transition:background .15s}.fight-row:hover{background:var(--bg-card-hover)}.fight-date{font-family:'Barlow Condensed',sans-serif;color:var(--text-muted);font-size:12px}.fight-opponent{font-weight:500}.fight-result{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px}.fight-result.win{color:var(--win)}.fight-result.loss{color:var(--loss)}.fight-result.draw{color:var(--draw)}.fight-elo-change{font-family:'Oswald',sans-serif;font-weight:500;text-align:right;font-size:14px}.fight-elo-change.positive{color:var(--win)}.fight-elo-change.negative{color:var(--loss)}
.matchup-container{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start;margin-bottom:28px}.matchup-side{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px}.matchup-side h3{font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:10px}.matchup-vs{display:flex;align-items:center;justify-content:center;padding-top:36px}.matchup-vs span{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--text-muted)}.matchup-fighter-name{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;margin-bottom:2px}.matchup-fighter-elo{font-family:'Oswald',sans-serif;font-size:16px;color:var(--accent-gold);margin-bottom:10px}.matchup-search{width:100%;padding:9px 12px;background:var(--bg-primary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-family:'Barlow',sans-serif;font-size:14px;outline:none}.matchup-search:focus{border-color:var(--accent-blue)}.matchup-dropdown{background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;margin-top:4px}.matchup-dropdown-item{padding:7px 12px;cursor:pointer;font-size:13px;transition:background .15s}.matchup-dropdown-item:hover{background:var(--bg-card-hover)}.matchup-dropdown-item .dd-elo{color:var(--text-muted);font-size:11px;margin-left:6px}
.prediction-bar-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:28px;text-align:center}.prediction-title{font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:16px}.prediction-bar{height:36px;border-radius:6px;display:flex;overflow:hidden;margin-bottom:12px}.prediction-bar .a-side{background:var(--accent-red);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;color:#fff;transition:width .5s ease}.prediction-bar .b-side{background:var(--accent-blue);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;color:#fff;transition:width .5s ease}.prediction-names{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:1px}.prediction-names .a-name{color:var(--accent-red)}.prediction-names .b-name{color:var(--accent-blue)}.prediction-confidence{margin-top:16px;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}.confidence-tag{display:inline-block;padding:3px 10px;border-radius:4px;font-weight:600;margin-left:8px}.confidence-tag.high{background:var(--accent-green-dim);color:var(--accent-green)}.confidence-tag.medium{background:var(--accent-gold-dim);color:var(--accent-gold)}.confidence-tag.low{background:var(--accent-red-dim);color:var(--accent-red)}
.upset-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:10px;display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;transition:background .15s}.upset-card:hover{background:var(--bg-card-hover)}.upset-rank{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--accent-gold);text-align:center}.upset-winner{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;color:var(--accent-green)}.upset-loser{font-family:'Barlow Condensed',sans-serif;color:var(--text-secondary);font-size:13px}.upset-gap{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--accent-red);text-align:right}.upset-meta{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;text-align:right}
.no-timeline-msg{color:var(--text-muted);font-style:italic;text-align:center;padding:40px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:768px){.header{padding:12px 16px}.main{padding:12px 16px}.stats-bar{grid-template-columns:repeat(2,1fr)}.profile-name{font-size:28px}.matchup-container{grid-template-columns:1fr}.matchup-vs{padding:10px 0}.fight-row{grid-template-columns:70px 1fr 56px 70px;font-size:12px}.nav-btn{padding:6px 10px;font-size:11px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
let DATA=null,FIGHTERS=[],TIMELINES={};
const INACTIVE_DAYS=730;
const state={view:'rankings',search:'',weightClass:'All',statusFilter:'all',sortBy:'e',sortDir:'desc',page:1,perPage:30,selectedFighter:null,matchA:null,matchB:null,matchSearchA:'',matchSearchB:'',showDropdownA:false,showDropdownB:false};
function expectedScore(ra,rb){return 1/(1+Math.pow(10,(rb-ra)/400))}
function getLatestDate(){let m='';FIGHTERS.forEach(f=>{if(f.lf&&f.lf>m)m=f.lf});return m?new Date(m):new Date()}
function isActive(f){if(!f.lf)return false;return(getLatestDate()-new Date(f.lf))/(864e5)<=INACTIVE_DAYS}
function render(){document.getElementById('app').innerHTML=`<div class="app">${renderHeader()}<div class="main">${state.view==='rankings'?renderRankings():state.view==='profile'?renderProfile():state.view==='matchup'?renderMatchup():state.view==='upsets'?renderUpsets():state.view==='divisions'?renderDivisions():''}</div></div>`;attachEvents()}
function renderHeader(){const vs=[['rankings','Rankings'],['divisions','Divisions'],['matchup','Matchup'],['upsets','Upsets']];return`<div class="header"><div class="header-inner"><div class="logo"><h1>UFC ELO</h1><span>Rating System v2</span></div><div class="nav">${vs.map(([v,l])=>`<button class="nav-btn ${state.view===v?'active':''}" data-view="${v}">${l}</button>`).join('')}</div></div></div>`}
function getFilteredFighters(){let list=[...FIGHTERS];if(state.search){const s=state.search.toLowerCase();list=list.filter(f=>f.n.toLowerCase().includes(s))}if(state.weightClass!=='All')list=list.filter(f=>f.wc===state.weightClass);if(state.statusFilter==='active')list=list.filter(f=>isActive(f));else if(state.statusFilter==='inactive')list=list.filter(f=>!isActive(f));list.sort((a,b)=>{const dir=state.sortDir==='desc'?-1:1;if(state.sortBy==='n')return dir*a.n.localeCompare(b.n)*-1;return dir*((a[state.sortBy]||0)-(b[state.sortBy]||0))});return list}
function renderRankings(){const filtered=getFilteredFighters();const totalPages=Math.ceil(filtered.length/state.perPage);const start=(state.page-1)*state.perPage;const page=filtered.slice(start,start+state.perPage);const maxElo=FIGHTERS.length>0?Math.max(...FIGHTERS.slice(0,5).map(f=>f.e)):1900;const minElo=1300;const wcs=['All',...new Set(FIGHTERS.map(f=>f.wc).filter(Boolean))];const ac=FIGHTERS.filter(f=>isActive(f)).length;const thS=(k,l)=>{const a=state.sortBy===k;return`<th class="${a?'sorted':''}" data-sort="${k}">${l}${a?(state.sortDir==='desc'?' ↓':' ↑'):''}</th>`};
return`<div class="stats-bar"><div class="stat-card"><div class="stat-label">Active Fighters</div><div class="stat-value">${ac}</div></div><div class="stat-card"><div class="stat-label">Total Fighters</div><div class="stat-value">${FIGHTERS.length.toLocaleString()}</div></div><div class="stat-card"><div class="stat-label">#1 Ranked</div><div class="stat-value red">${FIGHTERS.length>0?FIGHTERS[0].n:'-'}</div></div><div class="stat-card"><div class="stat-label">Highest Peak</div><div class="stat-value gold">${FIGHTERS.length>0?Math.max(...FIGHTERS.map(f=>f.p)).toFixed(0):'-'}</div></div><div class="stat-card"><div class="stat-label">Prediction Accuracy</div><div class="stat-value blue">57.6%</div></div></div>
<div class="filters"><input type="text" class="search-input" placeholder="Search fighter..." value="${state.search}" id="searchInput"><select class="filter-select" id="weightFilter">${wcs.map(wc=>`<option value="${wc}" ${state.weightClass===wc?'selected':''}>${wc}</option>`).join('')}</select><div class="status-pills">${['all','active','inactive'].map(s=>`<button class="status-pill ${state.statusFilter===s?'active':''}" data-status="${s}">${s==='all'?'All Fighters':s==='active'?'Active':'Inactive'}</button>`).join('')}</div></div>
<div class="table-wrap"><table><thead><tr><th style="width:44px">#</th>${thS('n','Fighter')}${thS('e','Rating')}${thS('p','Peak')}<th>Record</th>${thS('f','Fights')}<th>Division</th><th>Status</th><th>Last Fight</th></tr></thead><tbody>${page.map((f,i)=>{const rank=start+i+1;const barW=Math.max(0,((f.e-minElo)/(maxElo-minElo))*70);const act=isActive(f);return`<tr data-fighter="${f.n}"><td><span class="rank-num ${rank<=3?'top3':''}">${rank}</span></td><td><span class="fighter-name">${f.n}</span></td><td><span class="elo-val">${f.e.toFixed(0)}</span><span class="elo-bar" style="width:${barW}px"></span></td><td><span class="elo-val" style="color:var(--accent-gold)">${f.p.toFixed(0)}</span></td><td><span class="record">${f.w}-${f.l}${f.d>0?'-'+f.d:''}</span></td><td>${f.f}</td><td><span class="weight-badge">${f.wc}</span></td><td><span class="status-badge ${act?'active':'inactive'}">${act?'Active':'Inactive'}</span></td><td><span class="last-fight-col">${f.lf||'—'}</span></td></tr>`}).join('')}</tbody></table>
<div class="pagination"><button class="page-btn" data-page="${state.page-1}" ${state.page<=1?'disabled':''}>← Prev</button><span style="color:var(--text-muted);font-size:12px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">Page ${state.page} of ${totalPages} · ${filtered.length} fighters</span><button class="page-btn" data-page="${state.page+1}" ${state.page>=totalPages?'disabled':''}>Next →</button></div></div>`}
function renderDivisions(){const divs=['Heavyweight','Light Heavyweight','Middleweight','Welterweight','Lightweight','Featherweight','Bantamweight','Flyweight',"Women's Featherweight","Women's Bantamweight","Women's Flyweight","Women's Strawweight"];const actF=FIGHTERS.filter(f=>isActive(f));return`<div class="chart-title" style="margin-bottom:20px;font-size:20px">Division Rankings — Active Fighters</div>`+divs.map(d=>{const df=actF.filter(f=>f.wc===d).sort((a,b)=>b.e-a.e).slice(0,10);if(!df.length)return'';return`<div class="chart-section"><div class="chart-title">${d}</div>${df.map((f,i)=>`<div class="fight-row" data-fighter="${f.n}" style="grid-template-columns:36px 1fr 80px 90px 70px"><span class="rank-num ${i<3?'top3':''}">${i+1}</span><span class="fighter-name">${f.n}</span><span class="elo-val">${f.e.toFixed(0)}</span><span class="record">${f.w}-${f.l}${f.d>0?'-'+f.d:''}</span><span class="last-fight-col">${f.lf||''}</span></div>`).join('')}</div>`}).join('')}
function renderUpsets(){const upsets=[];for(const[name,tl]of Object.entries(TIMELINES)){tl.forEach(t=>{if(t.r==='w'&&t.c>0)upsets.push({winner:name,loser:t.o,change:t.c,date:t.d,elo:t.e})})}upsets.sort((a,b)=>b.change-a.change);return`<div class="chart-title" style="margin-bottom:20px;font-size:20px">Biggest Upsets — Rating Points Gained</div>${upsets.slice(0,50).map((u,i)=>`<div class="upset-card"><div class="upset-rank">${i+1}</div><div><div class="upset-winner">${u.winner}</div><div class="upset-loser">defeated ${u.loser}</div></div><div><div class="upset-gap">+${u.change.toFixed(1)}</div><div class="upset-meta">${u.date}</div></div></div>`).join('')}`}
function renderProfile(){const f=state.selectedFighter;if(!f)return'';const tl=TIMELINES[f.n]||null;const act=isActive(f);return`<button class="profile-back" id="backBtn">← Back</button><div class="profile-header"><div class="profile-main"><div class="profile-name">${f.n}</div><div class="profile-meta"><div class="profile-meta-item"><strong>${f.wc}</strong></div><div class="profile-meta-item"><span class="status-badge ${act?'active':'inactive'}">${act?'Active':'Inactive'}</span></div>${f.h?`<div class="profile-meta-item">Height: <strong>${f.h}</strong></div>`:''}${f.rc?`<div class="profile-meta-item">Reach: <strong>${f.rc}</strong></div>`:''}${f.st?`<div class="profile-meta-item">Stance: <strong>${f.st}</strong></div>`:''}${f.lf?`<div class="profile-meta-item">Last Fight: <strong>${f.lf}</strong></div>`:''}</div><div class="profile-elo-cards"><div class="elo-card"><div class="elo-card-label">Current Rating</div><div class="elo-card-value current">${f.e.toFixed(0)}</div></div><div class="elo-card"><div class="elo-card-label">Peak Rating</div><div class="elo-card-value peak">${f.p.toFixed(0)}</div></div><div class="elo-card"><div class="elo-card-label">Record</div><div class="elo-card-value record-val">${f.w}-${f.l}${f.d>0?'-'+f.d:''}</div></div></div></div></div>${tl?renderEloChart(tl):'<div class="no-timeline-msg">Timeline not available.</div>'}${tl?renderFightHistory(tl):''}`}
function renderEloChart(tl){if(!tl||tl.length<2)return'<div class="no-timeline-msg">Not enough fights for chart.</div>';const W=900,H=260,PL=55,PR=20,PT=20,PB=30;const elos=tl.map(t=>t.e);const minE=Math.min(...elos)-30,maxE=Math.max(...elos)+30;const xS=i=>PL+(i/(tl.length-1))*(W-PL-PR);const yS=e=>PT+(1-(e-minE)/(maxE-minE))*(H-PT-PB);const lp=tl.map((t,i)=>`${xS(i).toFixed(1)},${yS(t.e).toFixed(1)}`).join(' ');const ap=`M${xS(0).toFixed(1)},${yS(tl[0].e).toFixed(1)} `+tl.map((t,i)=>`L${xS(i).toFixed(1)},${yS(t.e).toFixed(1)}`).join(' ')+` L${xS(tl.length-1).toFixed(1)},${H-PB} L${xS(0).toFixed(1)},${H-PB} Z`;const yT=[];const step=Math.ceil((maxE-minE)/5/10)*10;for(let v=Math.ceil(minE/step)*step;v<=maxE;v+=step)yT.push(v);const dots=tl.map((t,i)=>{const c=t.r==='w'?'var(--win)':t.r==='l'?'var(--loss)':'var(--draw)';return`<circle cx="${xS(i).toFixed(1)}" cy="${yS(t.e).toFixed(1)}" r="4" fill="${c}" stroke="var(--bg-card)" stroke-width="2"><title>${t.d}: ${t.r==='w'?'W':t.r==='l'?'L':'D'} vs ${t.o} (${t.e})</title></circle>`}).join('');return`<div class="chart-section"><div class="chart-title">Rating Over Career</div><div class="chart-canvas"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${1500>=minE&&1500<=maxE?`<line x1="${PL}" y1="${yS(1500).toFixed(1)}" x2="${W-PR}" y2="${yS(1500).toFixed(1)}" stroke="var(--text-muted)" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.5"/>`:''} ${yT.map(v=>`<line x1="${PL}" y1="${yS(v).toFixed(1)}" x2="${W-PR}" y2="${yS(v).toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/><text x="${PL-8}" y="${yS(v).toFixed(1)}" fill="var(--text-muted)" font-size="11" font-family="Barlow Condensed" text-anchor="end" dominant-baseline="middle">${v.toFixed(0)}</text>`).join('')}<path d="${ap}" fill="url(#aG)" opacity="0.3"/><polyline points="${lp}" fill="none" stroke="var(--accent-red)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<defs><linearGradient id="aG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent-red)" stop-opacity="0.4"/><stop offset="100%" stop-color="var(--accent-red)" stop-opacity="0"/></linearGradient></defs></svg></div></div>`}
function renderFightHistory(tl){return`<div class="chart-section"><div class="chart-title">Fight History</div>${[...tl].reverse().map(t=>{const rl=t.r==='w'?'WIN':t.r==='l'?'LOSS':'DRAW';const rc=t.r==='w'?'win':t.r==='l'?'loss':'draw';const cs=t.c>=0?`+${t.c.toFixed(1)}`:t.c.toFixed(1);const cc=t.c>=0?'positive':'negative';return`<div class="fight-row" data-fighter="${t.o}"><div class="fight-date">${t.d}</div><div class="fight-opponent">${t.o}</div><div class="fight-result ${rc}">${rl}</div><div class="fight-elo-change ${cc}">${cs}</div></div>`}).join('')}</div>`}
function renderMatchup(){const sr=(q,ex)=>{if(!q||q.length<2)return[];const ql=q.toLowerCase();return FIGHTERS.filter(f=>f.n.toLowerCase().includes(ql)&&f.n!==ex).slice(0,8)};const rA=sr(state.matchSearchA,state.matchB?.n),rB=sr(state.matchSearchB,state.matchA?.n);let ph='';if(state.matchA&&state.matchB){const pA=expectedScore(state.matchA.e,state.matchB.e);const pB=1-pA;const pctA=(pA*100).toFixed(1),pctB=(pB*100).toFixed(1);const gap=Math.abs(state.matchA.e-state.matchB.e);let cl,cc;if(gap>200){cl='High';cc='high'}else if(gap>80){cl='Medium';cc='medium'}else{cl='Low';cc='low'}ph=`<div class="prediction-bar-wrap"><div class="prediction-title">Win Probability</div><div class="prediction-bar"><div class="a-side" style="width:${pctA}%">${pctA}%</div><div class="b-side" style="width:${pctB}%">${pctB}%</div></div><div class="prediction-names"><span class="a-name">${state.matchA.n}</span><span class="b-name">${state.matchB.n}</span></div><div class="prediction-confidence">Confidence <span class="confidence-tag ${cc}">${cl}</span><span style="margin-left:12px">Rating gap: ${gap.toFixed(0)} pts</span></div></div>`}const sd=(s,f,sv,res,dd)=>{const l=s==='A'?'Fighter A':'Fighter B';const sc=s==='A'?'var(--accent-red)':'var(--accent-blue)';return`<div class="matchup-side"><h3>${l}</h3><input type="text" class="matchup-search" id="matchSearch${s}" placeholder="Search fighter..." value="${sv}" autocomplete="off">${dd&&res.length>0?`<div class="matchup-dropdown">${res.map(f=>`<div class="matchup-dropdown-item" data-select-${s.toLowerCase()}="${f.n}">${f.n} <span class="dd-elo">${f.e.toFixed(0)}</span></div>`).join('')}</div>`:''}${f?`<div style="margin-top:14px"><div class="matchup-fighter-name" style="color:${sc}">${f.n}</div><div class="matchup-fighter-elo">Rating: ${f.e.toFixed(0)} · Peak: ${f.p.toFixed(0)}</div><div style="color:var(--text-secondary);font-size:13px">${f.w}-${f.l}${f.d>0?'-'+f.d:''} · ${f.wc}</div>${f.h?`<div style="color:var(--text-muted);font-size:12px;margin-top:3px">${f.h}${f.rc?' · Reach: '+f.rc:''}${f.st?' · '+f.st:''}</div>`:''}<div style="margin-top:4px"><span class="status-badge ${isActive(f)?'active':'inactive'}">${isActive(f)?'Active':'Inactive'}</span></div></div>`:''}</div>`};return`<div class="matchup-container">${sd('A',state.matchA,state.matchSearchA,rA,state.showDropdownA)}<div class="matchup-vs"><span>VS</span></div>${sd('B',state.matchB,state.matchSearchB,rB,state.showDropdownB)}</div>${ph}`}

ment.getElementById(`matchSearch${s}`)?.focus()})}});document.querySelectorAll('[data-select-a]').forEach(el=>el.addEventListener('click',()=>{state.matchA=FIGHTERS.find(f=>f.n===el.dataset.selectA);state.matchSearchA=el.dataset.selectA;state.showDropdownA=false;render()}));document.querySelectorAll('[data-select-b]').forEach(el=>el.addEventListener('click',()=>{state.matchB=FIGHTERS.find(f=>f.n===el.dataset.selectB);state.matchSearchB=el.dataset.selectB;state.showDropdownB=false;render()}))}
